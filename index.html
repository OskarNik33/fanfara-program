<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Program — Fanfara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Coda:wght@400;800&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:'VCR';
    src:url('https://cdn.jsdelivr.net/gh/OskarNik33/fanfara-program@main/VCR_OSD_MONO_SLO-Regular-v5.ttf') format('truetype');
    font-display:swap;
  }
  :root{
    --topbar:72px;   /* space above the page for the Webflow navbar */
    --mayo:#EDEAD9; --concrete:#1A1B1B;
    --zenf:#DE9000; --ketchup:#C62000; --teal:#176A78; --muted:#B9B6A6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--concrete);color:var(--mayo);
    font-family:'Coda','Courier New',monospace}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #frame{position:relative;width:min(100vw,160vh)}
  #stage{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;background:var(--concrete)}

  /* The rendered TV scene. Its size and position are set so the TV sits where the old 3D TV was. */
  /* Soft vignette: darker edges so the centre (the TV) stands out */
  #stage::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse 75% 70% at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,.5) 100%)}
  #tvframe{position:absolute;width:115%;left:-8%;top:calc(var(--topbar) + (100% - var(--topbar)) * .52);transform:translateY(-46%);aspect-ratio:2000/1617}
  #room{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* The screen: a flat canvas placed over the render's screen area (measured as % of the image) */
  #screen{position:absolute;left:34.609%;top:33.333%;width:22.422%;height:26.715%;display:block}

  /* Channel list: left of the TV, in front of the room */
  #sched{position:absolute;left:3%;top:calc(var(--topbar) + (100% - var(--topbar)) / 2);transform:translateY(-50%);width:27%;z-index:5;
    padding:12px 0 6px;pointer-events:auto}
  #sched-head{text-shadow:none;font-family:'VCR','Courier New',monospace;font-size:clamp(13px,1.9vh,22px);
    letter-spacing:.06em;color:var(--zenf);padding:0 16px 10px;border-bottom:2px solid var(--zenf)}
  #schedule{list-style:none;margin:0;padding:0}
  #schedule li{display:grid;grid-template-columns:4.6em 1fr;align-items:center;gap:8px;
    padding:clamp(4px,.9vh,12px) 16px;border-bottom:1px solid rgba(237,234,217,.2);
    color:var(--mayo);cursor:pointer;transition:background .15s,color .15s}
  #schedule li .t{font-family:'VCR','Courier New',monospace;font-size:clamp(12px,1.9vh,22px);color:var(--zenf)}
  #schedule li .t.tba{color:#8d8a7c}
  #schedule li .n{font-family:'VCR','Courier New',monospace;font-size:clamp(12px,1.9vh,22px);line-height:1.15}
  #schedule li .c{display:block;font-size:clamp(10px,1.25vh,14px);letter-spacing:.12em;margin-bottom:2px;opacity:.8}
  #schedule li:hover{background:rgba(222,144,0,.45)}
  #schedule li.active{background:var(--zenf);color:var(--concrete)}
  #schedule li.active .t{color:var(--concrete)}
  #schedule li.active .c{opacity:1}

  /* Text panel: right side. Scrolls itself, with the bar hidden */
  #panel{position:absolute;right:2%;top:calc(var(--topbar) + (100% - var(--topbar)) / 2);transform:translateY(-50%);width:32%;z-index:5;
    max-height:88%;overflow-y:auto;overscroll-behavior:contain;padding:24px 26px;
    background:rgba(26,27,27,.86);
    pointer-events:auto;scrollbar-width:none}
  #panel::-webkit-scrollbar{display:none}
  #name{text-shadow:none;display:inline-block;font-family:'VCR','Courier New',monospace;font-weight:400;
    font-size:clamp(26px,3vw,44px);line-height:1.05;background:var(--zenf);color:var(--concrete);
    padding:.12em .3em .08em;margin:0 0 16px;transition:opacity .18s,transform .28s}
  #role{font-size:13px;letter-spacing:.05em;color:var(--muted);margin-bottom:16px;transition:opacity .18s,transform .28s}
  #talk{font-family:'Coda',Georgia,serif;font-style:italic;font-size:clamp(17px,1.8vw,22px);
    line-height:1.3;color:var(--mayo);max-width:30ch;margin:0 0 18px;transition:opacity .18s,transform .28s}
  #bio{font-family:'Coda',Georgia,serif;font-size:clamp(15px,1.3vw,20px);line-height:1.6;
    color:#e6e1cf;max-width:46ch;margin:0 0 24px;white-space:pre-line;transition:opacity .18s,transform .28s}
  .fade-out #name,.fade-out #role,.fade-out #talk,.fade-out #bio{opacity:0;transform:translateY(6px)}

  #hint{position:absolute;bottom:3%;left:0;right:0;text-align:center;font-size:11px;
    letter-spacing:.18em;text-transform:uppercase;color:rgba(237,234,217,.5);pointer-events:none}

  @media (min-width:701px){
    body{height:100vh;overflow:hidden}
    #frame{position:fixed;inset:0;width:100vw}
    #stage{aspect-ratio:auto;height:100%}
  }

  /* Phone: stage on top, list and text stacked below on the plain background */
  @media (max-width:700px){
    #frame{width:100vw;display:flex;flex-direction:column;padding-top:var(--topbar)}
    #stage{aspect-ratio:1/1;order:0}
    #tvframe{width:172%;left:-37%;top:42%}
    #panel{order:1;position:static;transform:none;width:auto;max-height:none;overflow:visible;padding:20px 16px;background:none}
    #sched{order:2;position:static;transform:none;width:auto;margin:0 16px 24px;background:none}
    #schedule li{padding:10px 0}
    #hint{display:none}
  }
</style>
</head>
<body>

<div id="frame">
  <div id="stage">
    <div id="tvframe">
      <img id="room" alt="" src="https://cdn.jsdelivr.net/gh/OskarNik33/fanfara-program@main/room-tv.jpg">
      <canvas id="screen" width="512" height="493"></canvas>
    </div>
  </div>

  <div id="sched">
    <div id="sched-head">PROGRAM &nbsp;09:00 — 17:00</div>
    <ul id="schedule"></ul>
  </div>

  <div id="panel">
    <h1 id="name"></h1>
    <div id="role"></div>
    <div id="talk"></div>
    <p id="bio"></p>
  </div>
  <div id="hint">scroll to change channel</div>
</div>

<script>
(function () {
  const DATA_BASE = 'https://cdn.jsdelivr.net/gh/OskarNik33/fanfara-program@main/';

  function start(SPEAKERS) {
    let currentIndex = 0, isTransitioning = false, staticAlpha = 0, blinkOn = true, lastBlink = 0;

    const panelEl = document.getElementById('panel');
    const nameEl = document.getElementById('name');
    const roleEl = document.getElementById('role');
    const talkEl = document.getElementById('talk');
    const bioEl = document.getElementById('bio');
    const scheduleEl = document.getElementById('schedule');

    // Screen canvas (visible) and a channel canvas (drawn once per change or blink)
    const screenEl = document.getElementById('screen');
    const ctx = screenEl.getContext('2d');
    const SW = screenEl.width, SH = screenEl.height;
    // Outline of the real screen glass, traced from the render (0..512 x 0..493)
    const SCREEN_SHAPE = [[183.7,1.8],[134.7,5.3],[99.0,8.9],[71.4,12.5],[50.0,16.0],[33.0,19.6],[21.4,23.2],[14.3,26.7],[9.8,30.3],[7.1,33.9],[5.4,37.4],[3.6,41.0],[2.7,44.6],[2.7,48.1],[1.8,51.7],[1.8,55.3],[1.8,58.8],[1.8,62.4],[0.9,66.0],[0.9,69.5],[0.9,73.1],[0.9,76.7],[0.9,80.2],[0.9,83.8],[0.9,87.4],[0.9,90.9],[0.9,94.5],[0.9,98.1],[0.9,101.6],[0.9,105.2],[0.9,108.8],[0.9,112.3],[0.9,115.9],[0.9,119.5],[0.9,123.0],[0.0,126.6],[0.9,130.2],[0.9,133.7],[0.0,137.3],[0.9,140.9],[0.9,144.4],[0.9,148.0],[0.9,151.6],[0.9,155.1],[0.9,158.7],[0.9,162.3],[0.9,165.8],[0.9,169.4],[0.9,173.0],[0.9,176.5],[1.8,180.1],[0.9,183.6],[1.8,187.2],[1.8,190.8],[1.8,194.3],[1.8,197.9],[1.8,201.5],[1.8,205.0],[1.8,208.6],[1.8,212.2],[1.8,215.7],[1.8,219.3],[1.8,222.9],[1.8,226.4],[1.8,230.0],[1.8,233.6],[1.8,237.1],[1.8,240.7],[1.8,244.3],[1.8,247.8],[1.8,251.4],[1.8,255.0],[1.8,258.5],[1.8,262.1],[1.8,265.7],[1.8,269.2],[1.8,272.8],[1.8,276.4],[1.8,279.9],[1.8,283.5],[1.8,287.1],[1.8,290.6],[1.8,294.2],[1.8,297.8],[1.8,301.3],[1.8,304.9],[1.8,308.5],[1.8,312.0],[1.8,315.6],[1.8,319.2],[1.8,322.7],[1.8,326.3],[1.8,329.9],[1.8,333.4],[1.8,337.0],[1.8,340.6],[1.8,344.1],[1.8,347.7],[1.8,351.3],[1.8,354.8],[1.8,358.4],[1.8,361.9],[1.8,365.5],[1.8,369.1],[1.8,372.6],[1.8,376.2],[1.8,379.8],[1.8,383.3],[1.8,386.9],[1.8,390.5],[1.8,394.0],[1.8,397.6],[1.8,401.2],[1.8,404.7],[1.8,408.3],[1.8,411.9],[1.8,415.4],[1.8,419.0],[1.8,422.6],[1.8,426.1],[2.7,429.7],[2.7,433.3],[2.7,436.8],[3.6,440.4],[4.5,444.0],[4.5,447.5],[6.2,451.1],[7.1,454.7],[10.7,458.2],[13.4,461.8],[19.6,465.4],[27.7,468.9],[39.2,472.5],[57.1,476.1],[78.5,479.6],[105.3,483.2],[132.9,486.8],[182.0,490.3],[332.7,490.3],[376.4,486.8],[407.6,483.2],[431.7,479.6],[453.1,476.1],[471.9,472.5],[483.5,468.9],[492.4,465.4],[497.7,461.8],[502.2,458.2],[504.0,454.7],[505.8,451.1],[507.5,447.5],[508.4,444.0],[508.4,440.4],[509.3,436.8],[509.3,433.3],[509.3,429.7],[510.2,426.1],[510.2,422.6],[510.2,419.0],[510.2,415.4],[510.2,411.9],[510.2,408.3],[510.2,404.7],[510.2,401.2],[510.2,397.6],[510.2,394.0],[510.2,390.5],[510.2,386.9],[510.2,383.3],[510.2,379.8],[510.2,376.2],[510.2,372.6],[510.2,369.1],[510.2,365.5],[510.2,361.9],[510.2,358.4],[510.2,354.8],[510.2,351.3],[510.2,347.7],[510.2,344.1],[510.2,340.6],[510.2,337.0],[510.2,333.4],[510.2,329.9],[510.2,326.3],[510.2,322.7],[510.2,319.2],[510.2,315.6],[510.2,312.0],[510.2,308.5],[510.2,304.9],[510.2,301.3],[510.2,297.8],[510.2,294.2],[510.2,290.6],[510.2,287.1],[510.2,283.5],[510.2,279.9],[510.2,276.4],[510.2,272.8],[510.2,269.2],[510.2,265.7],[510.2,262.1],[509.3,258.5],[510.2,255.0],[510.2,251.4],[510.2,247.8],[510.2,244.3],[510.2,240.7],[510.2,237.1],[510.2,233.6],[510.2,230.0],[510.2,226.4],[509.3,222.9],[510.2,219.3],[510.2,215.7],[510.2,212.2],[510.2,208.6],[510.2,205.0],[510.2,201.5],[510.2,197.9],[510.2,194.3],[510.2,190.8],[510.2,187.2],[510.2,183.6],[510.2,180.1],[510.2,176.5],[510.2,173.0],[510.2,169.4],[510.2,165.8],[510.2,162.3],[511.1,158.7],[511.1,155.1],[511.1,151.6],[511.1,148.0],[511.1,144.4],[511.1,140.9],[511.1,137.3],[511.1,133.7],[511.1,130.2],[511.1,126.6],[511.1,123.0],[511.1,119.5],[511.1,115.9],[511.1,112.3],[511.1,108.8],[511.1,105.2],[511.1,101.6],[511.1,98.1],[511.1,94.5],[511.1,90.9],[511.1,87.4],[511.1,83.8],[511.1,80.2],[511.1,76.7],[511.1,73.1],[511.1,69.5],[511.1,66.0],[510.2,62.4],[510.2,58.8],[510.2,55.3],[510.2,51.7],[509.3,48.1],[509.3,44.6],[508.4,41.0],[506.6,37.4],[504.9,33.9],[502.2,30.3],[496.8,26.7],[490.6,23.2],[478.1,19.6],[462.0,16.0],[440.6,12.5],[413.0,8.9],[376.4,5.3],[326.5,1.8]];
    const chan = document.createElement('canvas'); chan.width = SW; chan.height = SH;
    const cctx = chan.getContext('2d');

    // Static noise for channel changes
    const NOISE = 64;
    const noiseCv = document.createElement('canvas'); noiseCv.width = noiseCv.height = NOISE;
    const nctx = noiseCv.getContext('2d');
    function redrawNoise() {
      const img = nctx.createImageData(NOISE, NOISE);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = Math.random() * 255;
        img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255;
      }
      nctx.putImageData(img, 0, 0);
    }
    redrawNoise();

    // Portraits (jsDelivr sends CORS headers, so crossOrigin must be set before src)
    const portraits = SPEAKERS.map((s) => {
      if (!s.portrait) return null;
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = () => { if (SPEAKERS.indexOf(s) === currentIndex) drawChannel(currentIndex, blinkOn); };
      im.src = DATA_BASE + s.portrait;
      return im;
    });

    // Draw one channel into the channel canvas (no name on screen)
    function drawChannel(index, blink) {
      const s = SPEAKERS[index], c = cctx, w = SW, h = SH;
      const img = portraits[index];
      c.clearRect(0, 0, w, h);
      if (img && img.complete && img.naturalWidth) {
        const r = Math.max(w / img.naturalWidth, h / img.naturalHeight);
        c.drawImage(img, (w - img.naturalWidth * r) / 2, (h - img.naturalHeight * r) / 2,
                    img.naturalWidth * r, img.naturalHeight * r);
      } else {
        const g = c.createRadialGradient(w*.5, h*.42, 20, w*.5, h*.5, w*.7);
        g.addColorStop(0, s.c1 || '#DE9000'); g.addColorStop(1, s.c2 || '#1A1B1B');
        c.fillStyle = g; c.fillRect(0, 0, w, h);
        const initials = s.name.split(' ').map(p => p[0]).join('');
        c.fillStyle = 'rgba(237,234,217,0.92)';
        c.font = 'bold 110px Georgia, serif';
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(initials, w*.5, h*.45);
      }
      // channel number (top left) and on-air (top right)
      c.font = '24px VCR, "Courier New", monospace';
      c.textBaseline = 'alphabetic';
      c.textAlign = 'left';
      c.fillStyle = 'rgba(237,234,217,0.95)';
      c.fillText('CH ' + String(index + 1).padStart(2, '0'), 48, 72);
      c.textAlign = 'right';
      c.fillStyle = blink ? 'rgba(255,90,90,0.95)' : 'rgba(255,90,90,0.15)';
      c.fillText('● ON AIR', w - 48, 72);
      // scanlines + vignette
      c.fillStyle = 'rgba(0,0,0,0.12)';
      for (let y = 0; y < h; y += 3) c.fillRect(0, y, w, 1);
      const v = c.createRadialGradient(w*.5, h*.5, h*.35, w*.5, h*.5, h*.75);
      v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.45)');
      c.fillStyle = v; c.fillRect(0, 0, w, h);
    }

    // Show the channel canvas (and static, if changing channel) inside the rounded screen shape
    function renderScreen() {
      ctx.clearRect(0, 0, SW, SH);
      ctx.save();
      ctx.beginPath();
      SCREEN_SHAPE.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(chan, 0, 0);
      if (staticAlpha > 0) {
        ctx.globalAlpha = staticAlpha;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(noiseCv, 0, 0, SW, SH);
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }

    function updatePanel(index) {
      const s = SPEAKERS[index];
      panelEl.scrollTop = 0;
      nameEl.textContent = s.name;
      roleEl.textContent = s.role;
      talkEl.textContent = s.talk || '';
      bioEl.textContent = s.bio;
      renderSchedule();
    }

    function renderSchedule() {
      scheduleEl.innerHTML = '';
      SPEAKERS.forEach((s, i) => {
        const li = document.createElement('li');
        li.className = i === currentIndex ? 'active' : '';
        li.innerHTML = `<span class="t${s.time ? '' : ' tba'}">${s.time || 'TBA'}</span><span class="n"><span class="c">CH ${String(i+1).padStart(2,'0')}</span>${s.name}</span>`;
        li.addEventListener('click', () => { if (!isTransitioning) switchChannel(i); });
        scheduleEl.appendChild(li);
      });
    }

    function switchChannel(newIndex) {
      if (isTransitioning || newIndex === currentIndex) return;
      isTransitioning = true;
      panelEl.classList.add('fade-out');
      const start = performance.now(), total = 480;
      const noiseTimer = setInterval(redrawNoise, 45);
      function tick(now) {
        const p = Math.min(1, (now - start) / total);
        if (p < 0.5) {
          staticAlpha = p / 0.5;
        } else {
          if (currentIndex !== newIndex) {
            currentIndex = newIndex;
            drawChannel(currentIndex, true);
            updatePanel(currentIndex);
          }
          staticAlpha = 1 - (p - 0.5) / 0.5;
        }
        if (p < 1) requestAnimationFrame(tick);
        else {
          clearInterval(noiseTimer);
          staticAlpha = 0;
          isTransitioning = false;
          panelEl.classList.remove('fade-out');
        }
      }
      requestAnimationFrame(tick);
    }

    // Input: wheel and swipe change channel, except over the text panel (it scrolls itself)
    let wheelLock = false;
    function step(dir) {
      if (wheelLock || isTransitioning) return;
      wheelLock = true;
      setTimeout(() => { wheelLock = false; }, 550);
      switchChannel((currentIndex + dir + SPEAKERS.length) % SPEAKERS.length);
    }
    window.addEventListener('wheel', (e) => {
      if (e.target.closest && e.target.closest('#panel')) return;
      if (window.innerWidth > 700) e.preventDefault();
      step(e.deltaY > 0 ? 1 : -1);
    }, { passive: false });

    let touchY = null, touchOnText = false;
    window.addEventListener('touchstart', (e) => {
      touchY = e.touches[0].clientY;
      touchOnText = !!(e.target.closest && e.target.closest('#panel'));
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if (touchY === null || touchOnText) return;
      const dy = touchY - e.touches[0].clientY;
      if (Math.abs(dy) > 40) { step(dy > 0 ? 1 : -1); touchY = null; }
    }, { passive: true });

    // Render loop: blink the ON AIR light, then draw the screen
    function animate(now) {
      requestAnimationFrame(animate);
      if (!isTransitioning && now - lastBlink > 650) {
        lastBlink = now; blinkOn = !blinkOn;
        drawChannel(currentIndex, blinkOn);
      }
      renderScreen();
    }

    // Start
    updatePanel(0);
    drawChannel(0, true);
    document.fonts.load('24px VCR').then(() => drawChannel(currentIndex, blinkOn));
    requestAnimationFrame(animate);
  }

  // GitHub Pages (not jsDelivr): jsDelivr caches @main, which would show old speaker data
  fetch('https://oskarnik33.github.io/fanfara-program/speakers.json', { cache: 'no-store' })
    .then((r) => { if (!r.ok) throw new Error('speakers.json: HTTP ' + r.status); return r.json(); })
    .then((d) => start(d.speakers))
    .catch((err) => console.error('Could not load speakers.json', err));
})();
</script>
</body>
</html>
